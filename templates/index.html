<!DOCTYPE html>
<html>
<head>
    <title>Regex Generator</title>
</head>
<body>

<h2>Regex Generator</h2>

<form action="/generate/" method="get">
    <button type="submit">Generate Regex</button>
</form>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

{% if regex %}
<h3>Generated Regex:</h3>
<p><b>{{ regex }}</b></p>

<h4>Files:</h4>
<ul>
    {% for file in files %}
        <li>{{ file }}</li>
    {% endfor %}
</ul>
{% endif %}

</body>
</html>
